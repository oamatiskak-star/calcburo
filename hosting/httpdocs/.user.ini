; PHP-instellingen voor de aanvraagflow (PHP-FPM leest .user.ini; anders dezelfde waarden in Plesk > PHP-instellingen).
; max_file_uploads ruimer dan 10 zodat de applicatie een 11e bestand zelf kan weigeren in plaats van dat PHP het stil laat vallen.
upload_max_filesize = 20M
post_max_size = 52M
max_file_uploads = 20
max_input_time = 120
file_uploads = On
expose_php = Off
display_errors = Off
log_errors = On
